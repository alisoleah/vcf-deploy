---
# Master Playbook: VCF Automation Framework - Test Environment
# Description: Orchestrate the test deployment workflow with mock components

- name: VCF Automation Framework - Test Master Playbook
  hosts: localhost
  gather_facts: false
  vars_files:
    - group_vars/test.yml
    - credentials/test/vault.yml

  tasks:
    - name: Display test deployment configuration
      debug:
        msg: |
          VCF Automation Framework Test Deployment
          =========================================
          Environment: {{ vcf_environment }}
          VCF Version: {{ vcf_version }}
          Workflow Type: {{ workflow.type }}
          Simulation Mode: {{ workflow.simulation_mode }}
          Skip Hardware Prep: {{ workflow.skip_hardware_prep }}
          Skip Storage Prep: {{ workflow.skip_storage_prep }}
          Skip Pre-Flight: {{ workflow.skip_preflight }}
          Skip Day 2 Operations: {{ workflow.skip_day2_operations }}

- name: Include Storage Preparation Playbook (Real Isilon)
  import_playbook: playbooks/02_storage_prep.yml
  when: not workflow.skip_storage_prep

- name: Include VCF Payload Generation Playbook
  import_playbook: playbooks/04_vcf_payload_gen.yml

- name: Include VCF Deployment Playbook (Mock)
  import_playbook: playbooks/05_vcf_deployment_test.yml
  when: workflow.simulation_mode

- name: Test Deployment Summary
  debug:
    msg: |
      VCF Test Deployment Summary
      ==========================
      Environment: {{ vcf_environment }}
      VCF Version: {{ vcf_version }}
      Workflow Type: {{ workflow.type }}
      Status: COMPLETED
      Note: This was a test deployment with mock VCF components
