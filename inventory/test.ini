# VCF Automation Framework - Test Inventory File
# This file defines the hosts for the test environment
# Test environment uses real Isilon and mock VCF components

[vcf_hosts]
# Virtual ESXi hosts (optional - for pre-flight validation)
# Uncomment and configure if you have virtual ESXi hosts
# esxi-vm01 ansible_host=192.168.122.101
# esxi-vm02 ansible_host=192.168.122.102

[bmc_hosts]
# BMC interfaces - skipped in test environment
# No physical servers with BMC in test setup

[storage_hosts]
# Your actual Isilon/PowerScale appliance
# Replace with your Isilon IP address
isilon-lab ansible_host=YOUR_ISILON_IP_HERE

[vcf_installer]
# Mock VCF Installer - uses localhost for testing
vcf-installer ansible_host=127.0.0.1

[all:vars]
# Global variables for test environment
ansible_python_interpreter=/usr/bin/python3
ansible_user=root
# SSH key for test hosts (if using virtual ESXi)
# ansible_ssh_private_key_file=~/.ssh/id_rsa_test
