# VCF Automation Framework - Inventory File
# This file defines the hosts and groups for the VCF deployment

[vcf_hosts]
# ESXi hosts for VCF deployment
# Add your hosts here with their management IP addresses
# host01 ansible_host=192.168.1.101
# host02 ansible_host=192.168.1.102
# host03 ansible_host=192.168.1.103
# host04 ansible_host=192.168.1.104

[bmc_hosts]
# BMC (iDRAC/iLO) management interfaces
# These are the out-of-band management interfaces for the physical servers
# bmc01 ansible_host=192.168.0.101
# bmc02 ansible_host=192.168.0.102
# bmc03 ansible_host=192.168.0.103
# bmc04 ansible_host=192.168.0.104

[storage_hosts]
# Dell PowerScale/Isilon storage cluster
# powerscale ansible_host=192.168.2.100

[vcf_installer]
# VCF Installer appliance
# vcf-installer ansible_host=192.168.1.200

[all:vars]
# Global variables that apply to all hosts
ansible_python_interpreter=/usr/bin/python3
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_rsa
