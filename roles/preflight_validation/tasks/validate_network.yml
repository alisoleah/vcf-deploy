---
# Network Validation Tasks

- name: Check network connectivity to gateway
  wait_for:
    host: "{{ network.management.gateway }}"
    timeout: "{{ validation.network.ping_timeout }}"
  delegate_to: localhost
  register: gateway_connectivity

- name: Ping gateway to verify connectivity
  command: "ping -c {{ validation.network.ping_count }} {{ network.management.gateway }}"
  register: ping_result
  changed_when: false
  delegate_to: localhost
  when: gateway_connectivity is succeeded

- name: Verify ping was successful
  assert:
    - ping_result.rc == 0
  fail_msg: "Network connectivity to gateway failed"

- name: Check MTU settings on management interface
  command: "ip link show {{ ansible_default_ipv4.interface }}"
  register: mtu_info
  changed_when: false
  become: true
  register: mtu_result

- name: Validate MTU matches expected value
  assert:
    - mtu_info.stdout | regex_search('mtu (\\d+)') | first | int == network.management.mtu
  fail_msg: "MTU mismatch: expected {{ network.management.mtu }}, got {{ mtu_info.stdout | regex_search('mtu (\\d+)') | first }}"
  when: ansible_default_ipv4.interface is defined
